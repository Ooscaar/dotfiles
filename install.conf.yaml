- defaults:
    link:
      create: true
      relink: true
      force: true

- clean: ["~", "~/.config"]

- link:
    ~/.vim: vim
    ~/.oh-my-zsh: zsh/oh-my-zsh
    ~/.tmux.conf: tmux.conf
    ~/.vimrc: vimrc
    ~/.zshrc: zshrc
    ~/.zsh: zsh
    ~/.bashrc: bashrc
    ~/.config/i3: i3
    ~/.config/polybar: polybar
    ~/.config/Code/User/settings.json: vscode/settings.json
    ~/.config/Code/User/keybindings.json: vscode/keybindings.json
    ~/.config/Cursor/User/settings.json: vscode/settings.json
    ~/.config/Cursor/User/keybindings.json: vscode/keybindings.json
    ~/.config/dunst/dunstrc: config/dunst/dunstrc
    ~/.config/ghostty: ghostty
    ~/.config/starship.toml: starship/starship.toml
    ~/.config/atuin/config.toml: atuin/config.toml
    ~/.config/grobi/grobi.conf: grobi/grobi.conf
    ~/.config/systemd/user/grobi.service: grobi/grobi.service

- shell:
    - [git submodule update --init --recursive, Installing submodules]
